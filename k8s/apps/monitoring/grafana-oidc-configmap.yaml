apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-prometheus-stack-grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 10.4.1
    helm.sh/chart: grafana-7.3.9
data:
  grafana.ini: |
    [analytics]
    check_for_updates = true
    [grafana_net]
    url = https://grafana.net
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = grafana.homelab
    root_url = https://grafana.homelab
    [auth.generic_oauth]
    enabled = true
    name = Authentik
    allow_sign_up = true
    client_id = grafana
    client_secret = $__file{/etc/secrets/grafana-oidc/clientSecret}
    scopes = openid profile email groups
    auth_url = https://auth.homelab/application/o/authorize/
    token_url = https://auth.homelab/application/o/token/
    api_url = https://auth.homelab/application/o/userinfo/
    tls_client_ca = /etc/ssl/homelab/homelab-root-ca.crt
    groups_attribute_path = groups
    role_attribute_path = contains(groups[*], 'platform-admin') && 'Admin' || 'Viewer'
