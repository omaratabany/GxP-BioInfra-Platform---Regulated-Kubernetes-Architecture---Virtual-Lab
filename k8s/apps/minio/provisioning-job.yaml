apiVersion: batch/v1
kind: Job
metadata:
  name: minio-provisioning
  namespace: minio
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-provisioning
        app.kubernetes.io/part-of: gxp-platform
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      nodeSelector:
        node-role: storage
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mc alias set homelab http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing homelab/pipeline-input
              mc mb --ignore-existing homelab/pipeline-output
              mc mb --ignore-existing homelab/pipeline-work
              mc mb --ignore-existing --with-lock homelab/loki-chunks
              mc version enable homelab/pipeline-output
              mc version enable homelab/loki-chunks
              mc ilm rule add homelab/pipeline-work --expire-days 30 || true
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-secret
                  key: root-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
