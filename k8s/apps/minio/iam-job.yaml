apiVersion: batch/v1
kind: Job
metadata:
  name: minio-iam
  namespace: minio
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-iam
        app.kubernetes.io/part-of: gxp-platform
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      nodeSelector:
        node-role: storage
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mc alias set homelab http://minio.minio.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc admin user add homelab nextflow-sa "$NEXTFLOW_SECRET_KEY" || true
              mc admin user add homelab loki-sa "$LOKI_SECRET_KEY" || true
              mc admin policy create homelab nextflow-policy /policies/nextflow-policy.json || true
              mc admin policy create homelab loki-policy /policies/loki-policy.json || true
              mc admin policy attach homelab nextflow-policy --user nextflow-sa
              mc admin policy attach homelab loki-policy --user loki-sa
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-secret
                  key: root-password
            - name: NEXTFLOW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-service-users
                  key: nextflow-secret-key
            - name: LOKI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-service-users
                  key: loki-secret-key
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: minio-iam-policies
