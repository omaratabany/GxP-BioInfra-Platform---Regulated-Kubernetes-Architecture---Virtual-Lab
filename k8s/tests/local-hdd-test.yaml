apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-hdd-test
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hdd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: local-hdd-test
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    node-role: storage
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          set -eu
          echo "hdd pvc write test $(date -Iseconds)" > /data/proof.txt
          cat /data/proof.txt
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: local-hdd-test
